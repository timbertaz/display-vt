; Reversing camera node: ESP32-S3-DevKitC-1 N16R8 + Waveshare OV5640 Camera Board (C)
; Open THIS folder (camera-node) in VS Code as its own PlatformIO project.
;
; It makes its own WiFi network "HESAB-CAM". The display joins it and shows the picture
; on the Camera tab. A phone can join too: open http://192.168.4.1 to test the camera.

[env:camera]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv

; Upload & monitor through the port marked "UART" on the DevKitC
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
