# ESP-IDF component manager: PlatformIO downloads these on the first build.
dependencies:
  idf:
    version: ">=5.1.0"
  # LVGL 8.3, same major version as Waveshare's ESP-IDF example for this board.
  # Configured through sdkconfig.defaults (CONFIG_LV_*).
  lvgl/lvgl:
    version: "~8.3.11"
  # Fast JPEG decoder (uses the ESP32-S3 vector instructions) for the reversing camera
  espressif/esp_new_jpeg:
    version: "^1.0.0"
