; Waveshare ESP32-S3-Touch-LCD-7 as an ISOBUS Virtual Terminal (draws the implement's screens with LVGL)
; ESP-IDF framework, same platform version as the XIAO implement project.

[env:display]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf

board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv

; Pinned to one library version (31 Oct 2026) so both ends match and updates can't break the build
lib_deps = https://github.com/Open-Agriculture/AgIsoStack-plus-plus.git#9e9e70c35ad10259db524c0ed8ec63cd8dca078e
build_flags = -Wno-error=missing-field-initializers

; Upload & monitor through the USB-to-UART Type-C port (as before)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
